name: Build & Deploy Documentation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  # Pin the UniLab commit / branch the docs build against. Bump on releases.
  UNILAB_REF: main

jobs:
  build:
    name: Build Sphinx
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout docs
        uses: actions/checkout@v4

      - name: Checkout UniLab source (best-effort, for autodoc)
        id: checkout_unilab
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: unilabsim/UniLab
          ref: ${{ env.UNILAB_REF }}
          path: UniLab
          # Optional: when UniLab is private, configure a `UNILAB_RO_TOKEN`
          # repo secret with `repo: read` access to enable full autodoc.
          # Without it (or when UniLab is public), we fall back to
          # github.token — which works for public repos but not private
          # cross-repo reads. The step is best-effort: a failed checkout
          # downgrades the build to prose-only.
          token: ${{ secrets.UNILAB_RO_TOKEN || github.token }}

      - name: Report UniLab availability
        run: |
          if [ "${{ steps.checkout_unilab.outcome }}" = "success" ] && [ -d UniLab ]; then
            echo "::notice::UniLab source available — autodoc enabled"
            echo "UNILAB_PRESENT=1" >> "$GITHUB_ENV"
          else
            echo "::warning::UniLab source unavailable — building prose-only docs (API reference will be skipped)"
            echo "UNILAB_PRESENT=0" >> "$GITHUB_ENV"
            echo "UNILAB_DOCS_SKIP_AUTODOC=1" >> "$GITHUB_ENV"
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
              libgl1 libegl1 libosmesa6 libglfw3 \
              ffmpeg

      - name: Install doc deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install UniLab in editable mode (autodoc target)
        if: env.UNILAB_PRESENT == '1'
        # We don't install the [motrix] extra in CI to avoid the private index.
        # Heavy imports are mocked in `conf.py` via `autodoc_mock_imports`.
        run: |
          pip install -e ./UniLab || {
            echo "::warning::UniLab install failed — downgrading to prose-only"
            echo "UNILAB_DOCS_SKIP_AUTODOC=1" >> "$GITHUB_ENV"
          }

      - name: Build HTML
        run: |
          # `-n` warns on broken cross-refs but `-W` is intentionally NOT
          # set so the first deploy can succeed while stubs are filled in.
          sphinx-build -b html -n source build/html

      - name: Build linkcheck (non-blocking)
        continue-on-error: true
        run: sphinx-build -b linkcheck source build/linkcheck

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/html

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
